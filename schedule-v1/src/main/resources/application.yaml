spring:
  application:
    name: schedule-v1

  datasource:
    url: jdbc:postgresql://localhost:5432/schedule
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
  hibernate:
    ddl-auto: validate
  show-sql: true
  properties:
      hibernate:
       format_sql: true
